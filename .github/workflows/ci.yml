name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Configure Nx Agents and task distribution in .nx/ci-config.yaml
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#nx-cloud-start-nx-agents
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: bunx nx start-nx-agents


      - run: bun install --no-cache
      - uses: nrwl/nx-set-shas@v5

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: bun nx record -- echo Hello World
      - run: bun nx affected -t lint test build

      # Enable after connecting this workspace with `bun nx connect`.
      # Nx Cloud-only commands fail while Nx Cloud is not connected.
      # - run: bun nx fix-ci
      #   if: always()
